[project]
name = "warble"
version = "0.1.0"
description = "Django application with server-rendered templates and HTMX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["django>=5.2,<5.3"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
